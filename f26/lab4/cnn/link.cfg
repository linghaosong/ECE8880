# v++ link options: place each kernel port in its own HBM bank so the ports
# do not share one bank's bandwidth (U55C: HBM[0] to HBM[31]). Port names
# follow CnnKernel in src/cnn.h; update these lines if you rename or add ports.
[connectivity]
sp=CnnKernel_1.in_img:HBM[0]
sp=CnnKernel_1.weight:HBM[2]
sp=CnnKernel_1.bias:HBM[4]
sp=CnnKernel_1.out_img:HBM[6]
